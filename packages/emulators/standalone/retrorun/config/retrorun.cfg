# SDL selects the video driver; RK3566-BSP currently uses KMSDRM.
retrorun_video_renderer = auto
retrorun_vsync = true
retrorun_audio_backend = sdl2
retrorun_show_loading_screen = true
retrorun_log_level = INFO
retrorun_core_log_level = INFO
retrorun_enable_key_log = false
retrorun_auto_save = false
retrorun_auto_load = false
retrorun_decorations = false
retrorun_achievements_enabled = false

# Match the RK3566-BSP RetroArch defaults for the current Flycast core.
flycast_alpha_sorting = "per-strip (fast, least accurate)"
flycast_delay_frame_swapping = "disabled"
flycast_auto_skip_frame = "disabled"
flycast_threaded_rendering = "enabled"
